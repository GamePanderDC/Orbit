name: Build Orbit iOS IPA

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Feather IPA
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Select Xcode version
        run: |
          sudo xcode-select -s /Applications/Xcode_16.0.app || sudo xcode-select -s /Applications/Xcode_16.app || sudo xcode-select -s /Applications/Xcode_15.4.app || true
          xcodebuild -version

      - name: Build WireGuardTURN.xcframework
        run: |
          cd WireGuardBridge
          make xcframework

      - name: Build iOS Archive (Unsigned)
        run: |
          xcodebuild archive \
            -project VKTurnProxy/VKTurnProxy.xcodeproj \
            -scheme VKTurnProxy \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Orbit.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package Feather IPA
        run: |
          mkdir -p build/Payload
          cp -r build/Orbit.xcarchive/Products/Applications/VKTurnProxy.app build/Payload/
          
          # Remove widget extension if present for Feather/AltStore compatibility (see docs/sideload.md)
          if [ -d "build/Payload/VKTurnProxy.app/PlugIns/OrbitWidgetExtension.appex" ]; then
            echo "Removing OrbitWidgetExtension for Feather compatibility..."
            rm -rf "build/Payload/VKTurnProxy.app/PlugIns/OrbitWidgetExtension.appex"
          fi
          
          cd build
          zip -r -9 Orbit-Feather.ipa Payload
          echo "IPA package created successfully:"
          ls -lh Orbit-Feather.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Orbit-Feather-IPA
          path: build/Orbit-Feather.ipa
          retention-days: 30

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/Orbit-Feather.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
